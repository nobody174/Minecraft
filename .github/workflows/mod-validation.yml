name: Mod Validation & Checks

on:
  push:
    branches: [ main ]
    paths:
      - 'mods/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-structure:
    runs-on: ubuntu-latest
    name: Validate Mod Structure

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate mod folders exist
        run: |
          echo "## Mod Structure Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Checking all mods in mods/ folder..." >> $GITHUB_STEP_SUMMARY

          for MOD_DIR in mods/*/; do
            MOD_NAME=$(basename "$MOD_DIR")
            echo "  ✓ $MOD_NAME" >> $GITHUB_STEP_SUMMARY
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** Gradle build is the primary validation (ensures all files are present and compilable)." >> $GITHUB_STEP_SUMMARY

  validate-config:
    runs-on: ubuntu-latest
    name: Validate Configuration Files

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate TOML files
        run: |
          echo "## Configuration Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          for toml_file in $(find mods -name "*.toml"); do
            if grep -q "modId=" "$toml_file" 2>/dev/null; then
              echo "✅ $toml_file (valid)" >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️ $toml_file (check required)" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Validate JSON files
        run: |
          # Check if jq is available for JSON validation
          if command -v jq &> /dev/null; then
            for json_file in $(find mods -name "*.json"); do
              if jq empty "$json_file" 2>/dev/null; then
                echo "✅ $json_file (valid JSON)" >> $GITHUB_STEP_SUMMARY
              else
                echo "❌ $json_file (invalid JSON)" >> $GITHUB_STEP_SUMMARY
              fi
            done
          fi

  documentation-check:
    runs-on: ubuntu-latest
    name: Check Documentation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify README files
        run: |
          echo "## Documentation Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          for readme in $(find mods -name "README.md"); do
            MOD_NAME=$(dirname $readme | sed 's|.*/||')
            SIZE=$(wc -c < "$readme")

            if [ $SIZE -gt 500 ]; then
              echo "✅ $MOD_NAME README ($(($SIZE / 1024))KB)" >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️ $MOD_NAME README (too short)" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Check for release notes
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          for notes in $(find mods -name "RELEASE_NOTES.md"); do
            echo "✅ Release notes found: $notes" >> $GITHUB_STEP_SUMMARY
          done
