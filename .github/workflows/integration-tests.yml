name: Integration Tests

on:
  workflow_dispatch:
    inputs:
      description:
        description: 'Manual trigger for integration tests'
        required: false

jobs:
  integration-test:
    runs-on: ubuntu-latest
    services:
      minecraft-server:
        image: itzg/minecraft-server:latest
        options: >-
          --health-cmd "exit 0"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Run integration tests
        run: mvn verify -DskipUnitTests
