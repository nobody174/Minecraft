name: Create Release

on:
  workflow_dispatch:
    inputs:
      mod_name:
        description: 'Mod folder name under mods/ (e.g. armor-aura)'
        required: true
        type: string
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
      notes:
        description: 'Release notes'
        required: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    name: Build & Release
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate mod exists
        run: |
          if [ ! -d "mods/${{ inputs.mod_name }}" ]; then
            echo "::error::mods/${{ inputs.mod_name }} does not exist. Check the folder name under https://github.com/${{ github.repository }}/tree/main/mods"
            exit 1
          fi
          if [ ! -f "mods/${{ inputs.mod_name }}/build.gradle.kts" ] && [ ! -f "mods/${{ inputs.mod_name }}/build.gradle" ]; then
            echo "::error::mods/${{ inputs.mod_name }} has no build.gradle.kts or build.gradle — not a valid mod folder."
            exit 1
          fi

      # The dispatch "version" input previously only controlled the GitHub
      # Release tag/name and CurseForge/Modrinth metadata — it never touched
      # mods/<mod>/gradle.properties, so the jar Gradle actually built used
      # whatever mod_version was already committed. That let the release
      # metadata and the built jar silently disagree (e.g. release tagged
      # v1.1.3 while the jar inside was still armoraura-1.1.1-...jar).
      # Writing the input into gradle.properties first, then committing it,
      # makes gradle.properties the single source of truth end to end.
      - name: Update mod_version in gradle.properties
        run: |
          PROPS_FILE="mods/${{ inputs.mod_name }}/gradle.properties"
          if ! grep -q '^mod_version=' "$PROPS_FILE"; then
            echo "::error::$PROPS_FILE has no mod_version= line."
            exit 1
          fi
          CURRENT_VERSION=$(grep '^mod_version=' "$PROPS_FILE" | cut -d= -f2)
          if [ "$CURRENT_VERSION" = "${{ inputs.version }}" ]; then
            echo "mod_version already ${{ inputs.version }}, no change needed."
          else
            sed -i "s/^mod_version=.*/mod_version=${{ inputs.version }}/" "$PROPS_FILE"
            echo "Updated mod_version: $CURRENT_VERSION -> ${{ inputs.version }}"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$PROPS_FILE"
            git commit -m "Bump ${{ inputs.mod_name }} to v${{ inputs.version }} (via Create Release workflow)"
            git push
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build ${{ inputs.mod_name }}
        working-directory: mods/${{ inputs.mod_name }}
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: Collect artifacts
        id: artifacts
        run: |
          MOD_PATH="mods/${{ inputs.mod_name }}"
          JAR_FILE=$(ls $MOD_PATH/build/libs/*.jar | head -1)
          JAR_NAME=$(basename $JAR_FILE)
          FILE_SIZE=$(stat --printf='%s' "$JAR_FILE")
          HUMAN_SIZE=$(numfmt --to=iec-i --suffix=B "$FILE_SIZE" 2>/dev/null || echo "${FILE_SIZE} bytes")
          echo "jar_file=$JAR_FILE" >> $GITHUB_OUTPUT
          echo "jar_name=$JAR_NAME" >> $GITHUB_OUTPUT
          echo "human_size=$HUMAN_SIZE" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.mod_name }}-v${{ inputs.version }}
          name: ${{ inputs.mod_name }} v${{ inputs.version }}
          body: |
            # Release: ${{ inputs.mod_name }} v${{ inputs.version }}

            ## Download

            - **JAR File:** `${{ steps.artifacts.outputs.jar_name }}`
            - **Size:** ${{ steps.artifacts.outputs.human_size }}

            ## Release Notes

            ${{ inputs.notes || 'See README.md for documentation.' }}

            ## Installation

            1. Download the JAR file from the assets below
            2. Place it in your mods folder:
               - **Client:** `%APPDATA%/.minecraft/mods/`
               - **Server:** `server/mods/`
            3. Launch Minecraft with NeoForge

            ## Support

            - 📖 [Documentation](https://github.com/${{ github.repository }}/tree/main/mods/${{ inputs.mod_name }})
            - 🐛 [Report Issues](https://github.com/${{ github.repository }}/issues)

            ---

            **Built at:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          files: ${{ steps.artifacts.outputs.jar_file }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Reads mods/<mod_name>/platform.json for the CurseForge project ID and
      # Modrinth slug. A new mod gets full pipeline coverage the moment it
      # has this file — no workflow edits needed. If the file is missing
      # (e.g. the mod hasn't been created on CurseForge/Modrinth yet),
      # platform publishing is skipped with a warning, everything else
      # (GitHub Release) still happens normally.
      - name: Resolve platform project IDs
        id: platform_ids
        run: |
          PLATFORM_FILE="mods/${{ inputs.mod_name }}/platform.json"
          if [ -f "$PLATFORM_FILE" ]; then
            CURSEFORGE_ID=$(jq -r '.curseforge_id // empty' "$PLATFORM_FILE")
            MODRINTH_ID=$(jq -r '.modrinth_id // empty' "$PLATFORM_FILE")
            echo "curseforge_id=$CURSEFORGE_ID" >> "$GITHUB_OUTPUT"
            echo "modrinth_id=$MODRINTH_ID" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No $PLATFORM_FILE found for ${{ inputs.mod_name }} — skipping CurseForge/Modrinth publish. Create the project on each platform, then add mods/${{ inputs.mod_name }}/platform.json (see mods/armor-aura/platform.json for the format)."
            echo "curseforge_id=" >> "$GITHUB_OUTPUT"
            echo "modrinth_id=" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to CurseForge & Modrinth
        if: steps.platform_ids.outputs.curseforge_id != '' && steps.platform_ids.outputs.modrinth_id != ''
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: ${{ steps.platform_ids.outputs.curseforge_id }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-id: ${{ steps.platform_ids.outputs.modrinth_id }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: ${{ steps.artifacts.outputs.jar_file }}
          name: ${{ inputs.mod_name }} v${{ inputs.version }}
          version: ${{ inputs.version }}
          version-type: release
          changelog: "${{ inputs.notes || format('See README.md for documentation. Full release notes: https://github.com/{0}/releases/tag/{1}-v{2}', github.repository, inputs.mod_name, inputs.version) }}"
          loaders: |
            neoforge
          game-versions: |
            1.21.1
          game-version-filter: releases
          # CurseForge started requiring an environment field on every Java
          # mod file upload from mid-July 2026 onward. Without it, uploads
          # silently fail while mc-publish (known bug, still open as of this
          # writing: Kira-NT/mc-publish#138) misreports it as a success in
          # the log. ALL = required on both client and server, matching how
          # these mods actually work.
          environment: ALL
          # fail (not warn): a real silent-failure case happened during
          # testing — CurseForge rejected an upload but mc-publish
          # misreported it as a success (open bug: Kira-NT/mc-publish#138).
          # warn would have hidden that permanently; fail surfaces platform
          # publish problems loudly. The GitHub Release step above is
          # separate and already completed by this point either way, so a
          # publish failure here never costs you the release itself.
          fail-mode: fail

      # Patreon has no write API for posts (confirmed: read-only as of the
      # public API's entire lifetime), so this can't post directly. Instead,
      # it fills mods/PATREON_TEMPLATE.md with everything this pipeline
      # already knows (version, download links, requirements, install
      # steps) and leaves [WRITE: ...] placeholders for the creative
      # content (hook, feature bullets, roadmap) that only a human can
      # write. Uploaded as a workflow artifact — never committed to git,
      # since PATREON_UPDATE_DRAFT.md is intentionally gitignored.
      - name: Generate Patreon post draft
        id: patreon_draft
        run: |
          DRAFT_FILE="mods/${{ inputs.mod_name }}/PATREON_UPDATE_DRAFT.md"
          MOD_TITLE=$(grep '^mod_name=' "mods/${{ inputs.mod_name }}/gradle.properties" | cut -d= -f2)
          [ -z "$MOD_TITLE" ] && MOD_TITLE="${{ inputs.mod_name }}"

          cat > "$DRAFT_FILE" <<EOF
          ## [WRITE: emoji] ${MOD_TITLE} — Update (v${{ inputs.version }})

          Hey everyone! [WRITE: 1-sentence hook — what changed or why this update matters]

          ### ⭐ What It Does
          [WRITE: feature bullets — one per line, bold the name, one sentence of player-facing impact each]

          ### 🎮 How to Use
          [WRITE: quick start — menu/keybind path first, then key commands if applicable]

          ---

          ### 📥 WHERE TO GET IT
          **GitHub:** https://github.com/${{ github.repository }}/tree/main/mods/${{ inputs.mod_name }}

          Includes full documentation and complete command/feature list

          **Installation steps:**
          - Install NeoForge 21.1.233+
          - Drop the JAR into: \`%appdata%/.minecraft/mods/\`
          - Launch Minecraft 1.21.1
          - [WRITE: 1 short mod-specific first-action line]

          **Requirements:**
          - Minecraft 1.21.1
          - NeoForge 21.1.233+
          - Java 21+

          ### 📊 Version Status
          **Current: v${{ inputs.version }}**

          [WRITE: 1-2 sentences — what's included, tested/validated status]

          Full release notes: https://github.com/${{ github.repository }}/releases/tag/${{ inputs.mod_name }}-v${{ inputs.version }}

          ### 🔮 What's Next?
          [WRITE: near-term and longer-term roadmap bullets, direction only]

          ### 📋 Full Feature List (v${{ inputs.version }})
          [WRITE: bullet per shipped feature, one line each]

          ---

          🙏 **Thank You**
          Huge thanks to everyone supporting this project! Whether you're using ${MOD_TITLE} or one of my other projects, I appreciate you being here.

          More updates soon — happy [WRITE: theme verb]! [WRITE: emoji]✨
          EOF

          echo "draft_file=$DRAFT_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload Patreon draft as artifact
        uses: actions/upload-artifact@v4
        with:
          name: patreon-draft-${{ inputs.mod_name }}-v${{ inputs.version }}
          path: ${{ steps.patreon_draft.outputs.draft_file }}
          retention-days: 30

      - name: Post release summary
        run: |
          echo "## 🎉 Release Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Mod:** ${{ inputs.mod_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** v${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**JAR:** ${{ steps.artifacts.outputs.jar_name }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.platform_ids.outputs.curseforge_id }}" ]; then
            echo "**CurseForge / Modrinth:** Published" >> $GITHUB_STEP_SUMMARY
          else
            echo "**CurseForge / Modrinth:** Skipped (no project IDs mapped)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "**Patreon draft:** Generated — download from this run's Artifacts section, fill in [WRITE: ...] placeholders, open in a Markdown-rendering viewer (e.g. VS Code preview), then copy the RENDERED text into Patreon's editor so bold/headers carry over (Patreon does not render literal ## / ** on paste). No write API exists for Patreon posts, so this can't be posted automatically." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View Release](https://github.com/${{ github.repository }}/releases/tag/${{ inputs.mod_name }}-v${{ inputs.version }})" >> $GITHUB_STEP_SUMMARY
