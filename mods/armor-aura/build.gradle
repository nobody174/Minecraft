plugins {
    id 'net.neoforged.gradle.userdev' version '7.0.145'
    id 'java-library'
}

version = "${mod_version}"
group = 'com.nobody174.armoraura'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

minecraft {
    // accessTransformers.file 'src/main/resources/META-INF/accesstransformer.cfg'
}

dependencies {
    implementation "net.neoforged:neoforge:${neoforge_version}"

    // JUnit 5 - simple testing, no Minecraft integration
    testImplementation "org.junit.jupiter:junit-jupiter-api:5.10.1"
    testImplementation "org.junit.jupiter:junit-jupiter-engine:5.10.1"
    testImplementation "org.junit.jupiter:junit-jupiter-params:5.10.1"
}

test {
    useJUnitPlatform()
}

jar {
    archiveBaseName = "armoraura"
    archiveVersion = "${version}-mc${minecraft_version.replace('.', '_')}"
    manifest {
        attributes([
            "Specification-Title"  : "armoraura",
            "Implementation-Title" : "ArmorAura",
            "Implementation-Version": version,
            "Implementation-Vendor": "nobody174"
        ])
    }
}

runs {
    client {
        workingDirectory project.file('run')
    }
    server {
        workingDirectory project.file('run')
    }
}
