name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Build with Gradle
      run: ./gradlew build -x test

    - name: Check JAR was created
      run: |
        if [ -f build/libs/glowtools-*.jar ]; then
          echo "✅ JAR built successfully"
          ls -lh build/libs/
        else
          echo "❌ JAR not found!"
          exit 1
        fi
      shell: bash

    - name: Upload JAR to artifacts
      if: success()
      uses: actions/upload-artifact@v3
      with:
        name: glowtools-build
        path: build/libs/glowtools-*.jar
        retention-days: 30
